<svg xmlns="http://www.w3.org/2000/svg" width="400" height="520" viewBox="0 0 400 520">
  <title>Taxes and Payments Menu</title>
  <style>
    .row { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 17px; fill: #1c1c1e; }
  </style>

  <!-- Card background + border -->
  <rect x="1" y="1" width="398" height="518" rx="10" ry="10" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.5"/>

  <!-- Group 1 -->
  <text x="24" y="46" class="row">Taxes</text>
  <line x1="16" y1="78" x2="384" y2="78" stroke="#e4e4e4" stroke-width="1"/>

  <!-- Group 2 -->
  <text x="24" y="116" class="row">Tax Product Codes</text>
  <text x="24" y="166" class="row">Tax Unit of Measures</text>
  <line x1="16" y1="206" x2="384" y2="206" stroke="#e4e4e4" stroke-width="1"/>

  <!-- Group 3 -->
  <text x="24" y="244" class="row">Payment Types</text>
  <text x="24" y="294" class="row">Payment Type Mappings</text>
  <line x1="16" y1="334" x2="384" y2="334" stroke="#e4e4e4" stroke-width="1"/>

  <!-- Group 4 -->
  <text x="24" y="372" class="row">Banks &amp; Payment Gateways</text>
  <text x="24" y="422" class="row">Bank Identification Numbers (BIN)</text>
  <text x="24" y="472" class="row">EDC</text>
</svg>