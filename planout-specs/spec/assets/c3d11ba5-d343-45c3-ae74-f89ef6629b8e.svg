<svg width="640" height="480" viewBox="0 0 640 480" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!-- sheet -->
  <g id="modal-sheet">
    <rect x="0.5" y="0.5" width="639" height="479" rx="12" fill="white"/>
    <rect x="0.5" y="0.5" width="639" height="479" rx="12" stroke="#EBEDF1"/>
  </g>

  <!-- header -->
  <g id="modal-header">
    <text id="modal-title" x="24" y="39" font-size="16" font-weight="600" fill="#20242D">Address Filter</text>
    <g id="btn-close-icon">
      <path d="M604 26L616 38" stroke="#868C97" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M616 26L604 38" stroke="#868C97" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <rect x="0" y="64" width="640" height="1" fill="#EBEDF1"/>
  </g>

  <!-- row 1 -->
  <g id="field-country">
    <text x="24" y="98" font-size="12" fill="#565B66">Country</text>
    <rect x="24" y="106" width="284" height="34" rx="8" fill="#F7F8FA"/>
    <text x="38" y="127.5" font-size="12" fill="#9297A1">Country</text>
    <path d="M290 121.5L292.75 124.25L295.5 121.5" stroke="#B0B4BC" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="field-province">
    <text x="332" y="98" font-size="12" fill="#565B66">Province</text>
    <rect x="332" y="106" width="284" height="34" rx="8" fill="#F7F8FA"/>
    <text x="346" y="127.5" font-size="12" fill="#9297A1">Province</text>
  </g>

  <!-- row 2 -->
  <g id="field-regency">
    <text x="24" y="168" font-size="12" fill="#565B66">Regency/Municipality</text>
    <rect x="24" y="176" width="284" height="34" rx="8" fill="#F7F8FA"/>
    <text x="38" y="197.5" font-size="12" fill="#9297A1">Regency/Municipality</text>
  </g>

  <g id="field-district">
    <text x="332" y="168" font-size="12" fill="#565B66">District</text>
    <rect x="332" y="176" width="284" height="34" rx="8" fill="#F7F8FA"/>
    <text x="346" y="197.5" font-size="12" fill="#9297A1">District</text>
  </g>

  <!-- row 3 -->
  <g id="field-village">
    <text x="24" y="238" font-size="12" fill="#565B66">Village</text>
    <rect x="24" y="246" width="284" height="34" rx="8" fill="#F7F8FA"/>
    <text x="38" y="267.5" font-size="12" fill="#9297A1">Village</text>
  </g>

  <g id="field-postal-code">
    <text x="332" y="238" font-size="12" fill="#565B66">Postal Code</text>
    <rect x="332" y="246" width="284" height="34" rx="8" fill="#F7F8FA"/>
    <text x="346" y="267.5" font-size="12" fill="#9297A1">Postal Code</text>
  </g>

  <!-- row 4 -->
  <g id="field-address">
    <text x="24" y="308" font-size="12" fill="#565B66">Address</text>
    <rect x="24" y="316" width="592" height="76" rx="8" fill="#F7F8FA"/>
    <text x="38" y="337.5" font-size="12" fill="#9297A1">Address</text>
  </g>

  <!-- footer -->
  <g id="modal-footer">
    <rect x="0" y="416" width="640" height="1" fill="#EBEDF1"/>

    <g id="btn-close">
      <rect x="340.5" y="432.5" width="75" height="33" rx="8" fill="white"/>
      <rect x="340.5" y="432.5" width="75" height="33" rx="8" stroke="#D9DBE0"/>
      <text x="378" y="453.5" font-size="12" font-weight="500" fill="#565B66" text-anchor="middle">Close</text>
    </g>

    <g id="btn-clear-all">
      <rect x="428" y="432" width="88" height="34" rx="8" fill="#D6604A"/>
      <text x="472" y="453.5" font-size="12" font-weight="500" fill="white" text-anchor="middle">Clear All</text>
    </g>

    <g id="btn-apply">
      <rect x="528" y="432" width="88" height="34" rx="8" fill="#4E5BD6"/>
      <text x="572" y="453.5" font-size="12" font-weight="500" fill="white" text-anchor="middle">Apply</text>
    </g>
  </g>

</svg>